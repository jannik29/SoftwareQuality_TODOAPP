# SonarQube settings (read automatically by pysonar / sonar-scanner)
sonar.projectKey=SonarQube_TODOAPP
sonar.projectName=TODO App
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Production code and test code are separated
sonar.sources=todo.py,classes
sonar.tests=tests

# Reports created before the scan (see README: "Tests und SonarQube")
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
